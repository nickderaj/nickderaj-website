name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

  author-check:
    name: Author identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit authorship (PLAN §5.6)
        env:
          EXPECTED_NAME: 'Nick de Raj'
          EXPECTED_EMAIL: 'nickderaj@gmail.com'
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          # On a pull_request event the checked-out HEAD is GitHub's synthetic test-merge commit,
          # which is authored by whoever opened the PR and *always* committed by
          # `GitHub <noreply@github.com>` - so walking back from HEAD failed this check on every
          # pull request, the owner's included. Walk from the PR's real head instead, so only the
          # commits actually being proposed get checked. Falls back to the pushed commit on push.
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          TIP="${HEAD_REF:-HEAD}"
          if [ -n "${BASE_REF:-}" ] && git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            RANGE="${BASE_REF}..${TIP}"
          else
            RANGE="${TIP}"
          fi

          echo "Checking commits in range: $RANGE"
          failed=0

          while read -r sha; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            committer_name=$(git show -s --format='%cn' "$sha")
            committer_email=$(git show -s --format='%ce' "$sha")
            body=$(git show -s --format='%B' "$sha")

            if [ "$author_name" != "$EXPECTED_NAME" ] || [ "$author_email" != "$EXPECTED_EMAIL" ]; then
              echo "::error::Commit $sha has unexpected author: $author_name <$author_email>"
              failed=1
            fi
            if [ "$committer_name" != "$EXPECTED_NAME" ] || [ "$committer_email" != "$EXPECTED_EMAIL" ]; then
              echo "::error::Commit $sha has unexpected committer: $committer_name <$committer_email>"
              failed=1
            fi
            if echo "$body" | grep -qi 'Co-Authored-By'; then
              echo "::error::Commit $sha contains a Co-Authored-By trailer"
              failed=1
            fi
          done < <(git rev-list "$RANGE")

          exit $failed
