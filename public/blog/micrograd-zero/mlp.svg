<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="600" height="340" fill="#1e1e2e" rx="0"/>

  <!-- Layer labels -->
  <text x="70" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4" font-weight="600">Input</text>
  <text x="70" y="36" text-anchor="middle" font-size="11" fill="#7f849c">(3)</text>

  <text x="220" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4" font-weight="600">Hidden 1</text>
  <text x="220" y="36" text-anchor="middle" font-size="11" fill="#7f849c">(4)</text>

  <text x="380" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4" font-weight="600">Hidden 2</text>
  <text x="380" y="36" text-anchor="middle" font-size="11" fill="#7f849c">(4)</text>

  <text x="530" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4" font-weight="600">Output</text>
  <text x="530" y="36" text-anchor="middle" font-size="11" fill="#7f849c">(1)</text>

  <!-- Connections: Input -> Hidden 1 -->
  <g stroke="#585b70" stroke-width="0.8" opacity="0.7">
    <line x1="90" y1="100" x2="200" y2="75"/><line x1="90" y1="100" x2="200" y2="140"/>
    <line x1="90" y1="100" x2="200" y2="205"/><line x1="90" y1="100" x2="200" y2="270"/>
    <line x1="90" y1="170" x2="200" y2="75"/><line x1="90" y1="170" x2="200" y2="140"/>
    <line x1="90" y1="170" x2="200" y2="205"/><line x1="90" y1="170" x2="200" y2="270"/>
    <line x1="90" y1="240" x2="200" y2="75"/><line x1="90" y1="240" x2="200" y2="140"/>
    <line x1="90" y1="240" x2="200" y2="205"/><line x1="90" y1="240" x2="200" y2="270"/>
  </g>

  <!-- Connections: Hidden 1 -> Hidden 2 -->
  <g stroke="#585b70" stroke-width="0.8" opacity="0.7">
    <line x1="240" y1="75" x2="360" y2="75"/><line x1="240" y1="75" x2="360" y2="140"/>
    <line x1="240" y1="75" x2="360" y2="205"/><line x1="240" y1="75" x2="360" y2="270"/>
    <line x1="240" y1="140" x2="360" y2="75"/><line x1="240" y1="140" x2="360" y2="140"/>
    <line x1="240" y1="140" x2="360" y2="205"/><line x1="240" y1="140" x2="360" y2="270"/>
    <line x1="240" y1="205" x2="360" y2="75"/><line x1="240" y1="205" x2="360" y2="140"/>
    <line x1="240" y1="205" x2="360" y2="205"/><line x1="240" y1="205" x2="360" y2="270"/>
    <line x1="240" y1="270" x2="360" y2="75"/><line x1="240" y1="270" x2="360" y2="140"/>
    <line x1="240" y1="270" x2="360" y2="205"/><line x1="240" y1="270" x2="360" y2="270"/>
  </g>

  <!-- Connections: Hidden 2 -> Output -->
  <g stroke="#585b70" stroke-width="0.8" opacity="0.7">
    <line x1="400" y1="75" x2="508" y2="170"/>
    <line x1="400" y1="140" x2="508" y2="170"/>
    <line x1="400" y1="205" x2="508" y2="170"/>
    <line x1="400" y1="270" x2="508" y2="170"/>
  </g>

  <!-- Input layer neurons -->
  <circle cx="70" cy="100" r="20" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <circle cx="70" cy="170" r="20" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <circle cx="70" cy="240" r="20" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>

  <!-- Hidden layer 1 neurons -->
  <circle cx="220" cy="75" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="220" cy="140" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="220" cy="205" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="220" cy="270" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>

  <!-- Hidden layer 2 neurons -->
  <circle cx="380" cy="75" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="380" cy="140" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="380" cy="205" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <circle cx="380" cy="270" r="20" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>

  <!-- Output neuron -->
  <circle cx="530" cy="170" r="22" fill="#3d1e2e" stroke="#f38ba8" stroke-width="2"/>

  <!-- Labels inside neurons -->
  <text x="70" y="104" text-anchor="middle" font-size="11" fill="#cdd6f4" font-weight="500">x₁</text>
  <text x="70" y="174" text-anchor="middle" font-size="11" fill="#cdd6f4" font-weight="500">x₂</text>
  <text x="70" y="244" text-anchor="middle" font-size="11" fill="#cdd6f4" font-weight="500">x₃</text>
  <text x="530" y="174" text-anchor="middle" font-size="11" fill="#f38ba8" font-weight="500">ŷ</text>

  <!-- Config label -->
  <text x="300" y="325" text-anchor="middle" font-size="13" fill="#bac2de" font-style="italic">MLP([3, 4, 4, 1])</text>
</svg>
