<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="620" height="200" fill="#1e1e2e" rx="0"/>

  <defs>
    <marker id="fwd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#89b4fa"/>
    </marker>
    <marker id="bwd" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#f38ba8"/>
    </marker>
  </defs>

  <text x="310" y="28" text-anchor="middle" font-size="13" fill="#89b4fa" font-weight="600">FORWARD PASS</text>

  <circle cx="80" cy="80" r="32" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="80" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#cdd6f4">a</text>
  <text x="80" y="93" text-anchor="middle" font-size="11" fill="#bac2de">input</text>

  <circle cx="230" cy="80" r="32" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="230" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#cdd6f4">b</text>
  <text x="230" y="93" text-anchor="middle" font-size="11" fill="#bac2de">f(a)</text>

  <circle cx="380" cy="80" r="32" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="380" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#cdd6f4">c</text>
  <text x="380" y="93" text-anchor="middle" font-size="11" fill="#bac2de">g(b)</text>

  <circle cx="530" cy="80" r="32" fill="#3d1e2e" stroke="#f38ba8" stroke-width="2"/>
  <text x="530" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#f38ba8">loss</text>
  <text x="530" y="93" text-anchor="middle" font-size="11" fill="#bac2de">h(c)</text>

  <line x1="114" y1="80" x2="195" y2="80" stroke="#89b4fa" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="264" y1="80" x2="345" y2="80" stroke="#89b4fa" stroke-width="2" marker-end="url(#fwd)"/>
  <line x1="414" y1="80" x2="495" y2="80" stroke="#89b4fa" stroke-width="2" marker-end="url(#fwd)"/>

  <text x="310" y="145" text-anchor="middle" font-size="13" fill="#f38ba8" font-weight="600">BACKWARD PASS (chain rule)</text>

  <line x1="495" y1="165" x2="415" y2="165" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bwd)"/>
  <line x1="345" y1="165" x2="265" y2="165" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bwd)"/>
  <line x1="195" y1="165" x2="115" y2="165" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bwd)"/>

  <text x="455" y="183" text-anchor="middle" font-size="11" fill="#f38ba8">∂loss/∂c</text>
  <text x="305" y="183" text-anchor="middle" font-size="11" fill="#f38ba8">× ∂c/∂b</text>
  <text x="155" y="183" text-anchor="middle" font-size="11" fill="#f38ba8">× ∂b/∂a</text>
</svg>
