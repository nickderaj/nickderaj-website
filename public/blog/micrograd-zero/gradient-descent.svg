<svg viewBox="0 0 540 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="540" height="300" fill="#1e1e2e" rx="0"/>

  <!-- Loss surface contours -->
  <ellipse cx="270" cy="160" rx="220" ry="120" fill="none" stroke="#45475a" stroke-width="1.5"/>
  <ellipse cx="270" cy="160" rx="160" ry="85" fill="none" stroke="#585b70" stroke-width="1.5"/>
  <ellipse cx="270" cy="160" rx="100" ry="52" fill="none" stroke="#7f849c" stroke-width="1.5"/>
  <ellipse cx="270" cy="160" rx="45" ry="22" fill="none" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Minimum point -->
  <circle cx="270" cy="160" r="6" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/>
  <text x="270" y="195" text-anchor="middle" font-size="12" fill="#a6e3a1" font-weight="600">minimum loss</text>

  <!-- Gradient descent path - good learning rate -->
  <circle cx="430" cy="100" r="5" fill="#89b4fa"/>
  <circle cx="380" cy="120" r="5" fill="#89b4fa"/>
  <circle cx="340" cy="140" r="5" fill="#89b4fa"/>
  <circle cx="310" cy="152" r="5" fill="#89b4fa"/>
  <circle cx="285" cy="158" r="5" fill="#89b4fa"/>
  <line x1="427" y1="102" x2="383" y2="118" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="377" y1="122" x2="343" y2="138" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="337" y1="142" x2="313" y2="150" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="307" y1="153" x2="288" y2="157" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="440" y="90" font-size="11" fill="#89b4fa" font-weight="500">good lr ✓</text>

  <!-- Too large learning rate path -->
  <circle cx="120" cy="110" r="5" fill="#f38ba8"/>
  <circle cx="400" cy="200" r="5" fill="#f38ba8"/>
  <circle cx="140" cy="220" r="5" fill="#f38ba8"/>
  <line x1="123" y1="112" x2="397" y2="198" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="397" y1="202" x2="143" y2="218" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="95" y="100" font-size="11" fill="#f38ba8" font-weight="500">lr too large ✗</text>

  <!-- Legend -->
  <text x="270" y="260" text-anchor="middle" font-size="12" fill="#bac2de" font-style="italic">Contour plot of loss surface. Each ring = same loss value.</text>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#bac2de" font-style="italic">Gradient descent steps toward the minimum.</text>
</svg>
