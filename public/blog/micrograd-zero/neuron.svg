<svg viewBox="0 0 580 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="580" height="280" fill="#1e1e2e" rx="0"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7f849c"/>
    </marker>
  </defs>

  <!-- Inputs -->
  <circle cx="60" cy="60" r="24" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="60" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#cdd6f4">x₁</text>

  <circle cx="60" cy="140" r="24" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="60" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#cdd6f4">x₂</text>

  <circle cx="60" cy="220" r="24" fill="#283d55" stroke="#89b4fa" stroke-width="2"/>
  <text x="60" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#cdd6f4">x₃</text>

  <!-- Weights on edges -->
  <line x1="86" y1="60" x2="218" y2="120" stroke="#7f849c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="140" y="78" font-size="12" fill="#fab387" font-weight="500">w₁</text>

  <line x1="86" y1="140" x2="218" y2="140" stroke="#7f849c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="148" y="133" font-size="12" fill="#fab387" font-weight="500">w₂</text>

  <line x1="86" y1="220" x2="218" y2="160" stroke="#7f849c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="140" y="205" font-size="12" fill="#fab387" font-weight="500">w₃</text>

  <!-- Sum node -->
  <circle cx="250" cy="140" r="32" fill="#3d3510" stroke="#f9e2af" stroke-width="2"/>
  <text x="250" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#f9e2af">Σ</text>
  <text x="250" y="154" text-anchor="middle" font-size="10" fill="#bac2de">+ bias</text>

  <!-- Bias arrow -->
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#cba6f7" font-weight="500">b</text>
  <line x1="250" y1="200" x2="250" y2="174" stroke="#cba6f7" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow to activation -->
  <line x1="284" y1="140" x2="348" y2="140" stroke="#7f849c" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Activation function -->
  <rect x="350" y="110" width="80" height="60" rx="10" fill="#1e3d2e" stroke="#a6e3a1" stroke-width="2"/>
  <text x="390" y="137" text-anchor="middle" font-size="15" font-weight="600" fill="#a6e3a1">tanh</text>
  <text x="390" y="155" text-anchor="middle" font-size="10" fill="#bac2de">activation</text>

  <!-- Output -->
  <line x1="432" y1="140" x2="488" y2="140" stroke="#7f849c" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="520" cy="140" r="28" fill="#3d1e2e" stroke="#f38ba8" stroke-width="2"/>
  <text x="520" y="137" text-anchor="middle" font-size="13" font-weight="600" fill="#f38ba8">out</text>
  <text x="520" y="153" text-anchor="middle" font-size="10" fill="#bac2de">[-1, 1]</text>

  <!-- Formula at bottom -->
  <text x="290" y="270" text-anchor="middle" font-size="13" fill="#bac2de" font-style="italic">out = tanh( w₁x₁ + w₂x₂ + w₃x₃ + b )</text>
</svg>
