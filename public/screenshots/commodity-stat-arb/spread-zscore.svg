<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Spread z-score with entry and exit bands</title>
  <desc id="desc">Placeholder mockup of a cointegrated commodity spread's rolling z-score against its entry and exit thresholds, with trade markers.</desc>
  <defs>
    <pattern id="grid4" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c1f24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0b0c0e"/>
  <rect width="1600" height="1000" fill="url(#grid4)"/>

  <text x="48" y="72" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="30" fill="#e8e9eb">SPREAD Z-SCORE &#8212; ENTRY / EXIT</text>
  <text x="48" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" fill="#8b8f96">COINTEGRATED PAIR &#183; TERM-STRUCTURE REGIME GATE: ON</text>

  <rect x="48" y="140" width="1504" height="700" fill="#121316" stroke="#23262b"/>

  <!-- zero line -->
  <line x1="96" y1="490" x2="1504" y2="490" stroke="#8b8f96" stroke-width="1"/>
  <text x="1470" y="484" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8b8f96">0</text>

  <!-- entry / exit bands -->
  <line x1="96" y1="330" x2="1504" y2="330" stroke="#c4685f" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.75"/>
  <text x="1460" y="324" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#c4685f">+2.0 ENTRY</text>
  <line x1="96" y1="650" x2="1504" y2="650" stroke="#c4685f" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.75"/>
  <text x="1460" y="644" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#c4685f">-2.0 ENTRY</text>
  <line x1="96" y1="410" x2="1504" y2="410" stroke="#5fb3c4" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="1460" y="404" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#5fb3c4">EXIT</text>
  <line x1="96" y1="570" x2="1504" y2="570" stroke="#5fb3c4" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- oscillating z-score line -->
  <polyline fill="none" stroke="#e8e9eb" stroke-width="2"
    points="96,490 140,440 184,380 228,340 272,360 316,420 360,470 404,520 448,580
             492,640 536,620 580,560 624,500 668,450 712,400 756,350 800,320
             844,360 888,420 932,480 976,540 1020,600 1064,630 1108,580 1152,520
             1196,460 1240,400 1284,350 1328,330 1372,380 1416,440 1460,500 1504,460"/>

  <!-- entry/exit trade markers -->
  <g>
    <circle cx="272" cy="360" r="7" fill="#5fb3c4"/>
    <text x="280" y="350" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5fb3c4">SHORT ENTRY</text>
    <circle cx="404" cy="410" r="7" fill="#e8e9eb"/>
    <text x="412" y="400" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#e8e9eb">EXIT</text>

    <circle cx="492" cy="640" r="7" fill="#5fb3c4"/>
    <text x="500" y="660" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5fb3c4">LONG ENTRY</text>
    <circle cx="580" cy="570" r="7" fill="#e8e9eb"/>
    <text x="588" y="590" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#e8e9eb">EXIT</text>

    <circle cx="800" cy="320" r="7" fill="#5fb3c4"/>
    <text x="760" y="308" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5fb3c4">SHORT ENTRY</text>
    <circle cx="932" cy="410" r="7" fill="#e8e9eb"/>
    <text x="940" y="400" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#e8e9eb">EXIT</text>

    <circle cx="1064" cy="630" r="7" fill="#5fb3c4"/>
    <text x="1000" y="654" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#5fb3c4">LONG ENTRY</text>
    <circle cx="1196" cy="460" r="7" fill="#e8e9eb"/>
    <text x="1204" y="450" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#e8e9eb">EXIT</text>
  </g>

  <text x="48" y="944" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">PLACEHOLDER MOCKUP &#183; NOT LIVE DATA</text>
</svg>
