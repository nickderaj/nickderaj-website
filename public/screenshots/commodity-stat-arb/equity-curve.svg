<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Commodity spread book equity curve</title>
  <desc id="desc">Placeholder mockup of a Plotly Dash panel showing the cumulative equity curve of the commodity spread book from 2010 to present, including the held-out 2024-2026 segment.</desc>
  <defs>
    <pattern id="grid3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c1f24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0b0c0e"/>
  <rect width="1600" height="1000" fill="url(#grid3)"/>

  <text x="48" y="72" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="30" fill="#e8e9eb">COMMODITY SPREAD BOOK &#8212; EQUITY CURVE</text>
  <text x="48" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" fill="#8b8f96">2010 &#8211; PRESENT &#183; PLOTLY DASH</text>

  <rect x="48" y="140" width="1504" height="700" fill="#121316" stroke="#23262b"/>

  <!-- held-out region shading -->
  <rect x="1240" y="160" width="292" height="640" fill="#5fb3c4" opacity="0.08"/>
  <line x1="1240" y1="160" x2="1240" y2="800" stroke="#5fb3c4" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  <text x="1252" y="182" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#5fb3c4">HELD-OUT 2024&#8211;2026 (OUT-OF-SAMPLE)</text>

  <!-- axis -->
  <line x1="96" y1="780" x2="1504" y2="780" stroke="#8b8f96" stroke-width="1"/>
  <line x1="96" y1="780" x2="96" y2="180" stroke="#8b8f96" stroke-width="1"/>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8b8f96">
    <text x="90" y="798">2010</text>
    <text x="360" y="798">2014</text>
    <text x="630" y="798">2018</text>
    <text x="900" y="798">2022</text>
    <text x="1230" y="798">2024</text>
    <text x="1480" y="798">2026</text>
  </g>

  <!-- equity curve: full sample rising to +49.0% -->
  <polyline fill="none" stroke="#5fb3c4" stroke-width="3"
    points="96,760 180,752 260,758 340,738 420,744 500,712 580,720 660,690 740,700
             820,660 900,672 980,630 1060,616 1140,592 1240,560 1300,520 1360,470
             1420,410 1480,360 1504,330"/>

  <!-- drawdown dip annotation -->
  <path d="M 1060,616 L 1090,660 L 1120,600" fill="none" stroke="#c4685f" stroke-width="2" opacity="0.85"/>
  <circle cx="1090" cy="660" r="4" fill="#c4685f"/>

  <text x="1300" y="230" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="22" fill="#e8e9eb">+49.0%</text>
  <text x="1300" y="256" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#8b8f96">FULL-SAMPLE &#183; SHARPE 0.68</text>

  <text x="120" y="240" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#8b8f96">+14.9% HELD-OUT &#183; SHARPE 1.14 &#183; ~70% HIT RATE (470+ TRADES)</text>

  <text x="48" y="944" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">PLACEHOLDER MOCKUP &#183; NOT LIVE DATA</text>
</svg>
