<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Ceres interactive precious-metals reserves map</title>
  <desc id="desc">Placeholder mockup of an interactive map on Ceres showing global precious-metals reserve data by region, with a hover tooltip.</desc>
  <rect width="1600" height="1000" fill="#0b0c0e"/>

  <text x="80" y="80" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#5fb3c4">CERES &#8226; MARKETS</text>
  <text x="80" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" fill="#e8e9eb">Precious-Metals Reserves by Region</text>
  <line x1="80" y1="156" x2="1520" y2="156" stroke="#23262b" stroke-width="1"/>

  <!-- simplified world-map blobs -->
  <g fill="#1c1f24" stroke="#23262b" stroke-width="1">
    <path d="M 140,300 Q 220,260 300,300 Q 340,340 300,400 Q 240,440 180,410 Q 120,370 140,300 Z"/>
    <path d="M 340,420 Q 400,400 430,460 Q 440,540 400,600 Q 350,640 320,580 Q 300,480 340,420 Z"/>
    <path d="M 700,260 Q 800,230 880,270 Q 900,320 850,340 Q 760,360 700,320 Q 680,290 700,260 Z"/>
    <path d="M 720,380 Q 800,360 820,440 Q 800,520 750,540 Q 700,500 700,440 Q 700,400 720,380 Z"/>
    <path d="M 950,240 Q 1100,210 1250,250 Q 1320,290 1280,340 Q 1150,380 1000,350 Q 940,300 950,240 Z"/>
    <path d="M 1180,480 Q 1260,470 1290,530 Q 1270,580 1210,580 Q 1160,540 1180,480 Z"/>
  </g>

  <!-- hotspots -->
  <g>
    <circle cx="260" cy="330" r="10" fill="#5fb3c4"/>
    <circle cx="260" cy="330" r="20" fill="none" stroke="#5fb3c4" stroke-width="1.5" opacity="0.5"/>
    <circle cx="380" cy="520" r="14" fill="#5fb3c4"/>
    <circle cx="380" cy="520" r="26" fill="none" stroke="#5fb3c4" stroke-width="1.5" opacity="0.5"/>
    <circle cx="790" cy="300" r="8" fill="#5fb3c4"/>
    <circle cx="1050" cy="280" r="12" fill="#5fb3c4"/>
    <circle cx="1050" cy="280" r="22" fill="none" stroke="#5fb3c4" stroke-width="1.5" opacity="0.5"/>
    <circle cx="1230" cy="520" r="9" fill="#5fb3c4"/>
    <circle cx="770" cy="460" r="7" fill="#5fb3c4"/>
  </g>

  <!-- hover tooltip mockup -->
  <rect x="420" y="440" width="300" height="120" fill="#121316" stroke="#5fb3c4" stroke-width="1.5"/>
  <text x="440" y="472" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#e8e9eb">SOUTH AMERICA</text>
  <text x="440" y="500" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">SILVER RESERVES: 110,000 t</text>
  <text x="440" y="524" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">GOLD RESERVES: 4,200 t</text>
  <line x1="420" y1="500" x2="380" y2="520" stroke="#5fb3c4" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="1120" y="700" width="380" height="180" fill="#121316" stroke="#23262b"/>
  <text x="1144" y="732" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#5fb3c4">LEGEND</text>
  <circle cx="1152" cy="760" r="6" fill="#5fb3c4"/>
  <text x="1170" y="765" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#e8e9eb">RESERVE HOTSPOT</text>
  <text x="1144" y="800" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8b8f96">CIRCLE RADIUS &#8776; RELATIVE VOLUME</text>
  <text x="1144" y="828" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#8b8f96">HOVER A REGION FOR DETAIL</text>

  <text x="80" y="944" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">PLACEHOLDER MOCKUP &#183; NOT ACTUAL SITE CONTENT</text>
</svg>
