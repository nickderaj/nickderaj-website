<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">GARCH-t / EVT tail model calibration plot</title>
  <desc id="desc">Placeholder mockup of a calibration plot comparing realised tail exceedances against the model forecast, with a rolling exceedance-rate chart beneath.</desc>
  <defs>
    <pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c1f24" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0b0c0e"/>
  <rect width="1600" height="1000" fill="url(#grid2)"/>

  <text x="48" y="72" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="30" fill="#e8e9eb">GARCH-t / EVT &#8212; CALIBRATION</text>
  <text x="48" y="104" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="16" fill="#8b8f96">FORECAST VS. REALISED TAIL EXCEEDANCE &#183; ROLLING 250-DAY WINDOW</text>

  <!-- calibration scatter panel -->
  <rect x="48" y="140" width="700" height="640" fill="#121316" stroke="#23262b"/>
  <text x="72" y="176" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#5fb3c4">FORECAST QUANTILE VS. EMPIRICAL QUANTILE</text>

  <!-- perfect calibration diagonal -->
  <line x1="120" y1="720" x2="680" y2="200" stroke="#e8e9eb" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <text x="560" y="240" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#e8e9eb" opacity="0.8">PERFECT CALIBRATION</text>

  <!-- empirical scatter close to diagonal -->
  <g fill="#5fb3c4">
    <circle cx="150" cy="700" r="5"/>
    <circle cx="200" cy="640" r="5"/>
    <circle cx="240" cy="600" r="5"/>
    <circle cx="290" cy="550" r="5"/>
    <circle cx="330" cy="510" r="5"/>
    <circle cx="370" cy="470" r="5"/>
    <circle cx="410" cy="440" r="5"/>
    <circle cx="450" cy="400" r="5"/>
    <circle cx="490" cy="370" r="5"/>
    <circle cx="530" cy="330" r="5"/>
    <circle cx="570" cy="290" r="5"/>
    <circle cx="610" cy="255" r="5"/>
    <circle cx="650" cy="220" r="5"/>
  </g>

  <line x1="120" y1="740" x2="700" y2="740" stroke="#8b8f96" stroke-width="1"/>
  <line x1="120" y1="740" x2="120" y2="180" stroke="#8b8f96" stroke-width="1"/>
  <text x="360" y="770" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">FORECAST QUANTILE</text>
  <text x="60" y="460" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96" transform="rotate(-90 60 460)">EMPIRICAL QUANTILE</text>

  <!-- rolling exceedance rate panel -->
  <rect x="780" y="140" width="772" height="300" fill="#121316" stroke="#23262b"/>
  <text x="804" y="176" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#5fb3c4">ROLLING EXCEEDANCE RATE (250D)</text>
  <line x1="804" y1="330" x2="1520" y2="330" stroke="#8b8f96" stroke-width="1"/>
  <line x1="804" y1="290" x2="1520" y2="290" stroke="#e8e9eb" stroke-width="1" stroke-dasharray="5 5" opacity="0.6"/>
  <text x="1440" y="284" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#e8e9eb">TARGET 5%</text>
  <polyline fill="none" stroke="#5fb3c4" stroke-width="2.5"
    points="804,300 850,310 896,296 942,320 988,300 1034,286 1080,304 1126,294 1172,312 1218,298 1264,284 1310,300 1356,290 1402,306 1448,296 1494,300 1520,292"/>

  <!-- summary stats panel -->
  <rect x="780" y="480" width="772" height="300" fill="#121316" stroke="#23262b"/>
  <text x="804" y="516" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#5fb3c4">SUMMARY</text>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="15" fill="#e8e9eb">
    <text x="804" y="560">TARGET EXCEEDANCE RATE     5.00%</text>
    <text x="804" y="596">REALISED (ROLLING 250D)    4.92%</text>
    <text x="804" y="632">KUPIEC POF TEST            PASS</text>
    <text x="804" y="668">CHRISTOFFERSEN IND. TEST   PASS</text>
    <text x="804" y="704">CALIBRATION DRIFT FLAG     NONE</text>
  </g>

  <text x="48" y="944" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8b8f96">PLACEHOLDER MOCKUP &#183; NOT LIVE DATA</text>
</svg>
